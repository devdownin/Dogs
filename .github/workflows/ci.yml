name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7-stable
    steps:
      - uses: actions/checkout@v4
      - name: Valider les données et rejouer (simulateur de référence)
        run: |
          pip install jsonschema
          python3 -I tools/validate.py data
      - name: Installer Godot
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}_linux.x86_64 godot
      - name: Importer le projet
        run: |
          ./godot --headless --path . --import
          ./godot --headless --path . --import
      - name: Rejouer dans le cœur de règles GDScript
        run: ./godot --headless --path . -s tests/run_replays.gd
      - name: Jouer la scène par touchers simulés
        run: ./godot --headless --path . -s tests/run_ui.gd
